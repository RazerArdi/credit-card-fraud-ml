name: Python Code Quality

on: [push, pull_request]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Quality Assurance Tools
      run: |
        pip install flake8 black mypy
        pip install -r dashboard/05_Model_Serving/requirements.txt
        pip install -r dashboard/06_Dashboard/requirements.txt
        
    - name: Run Black (Formatting Check)
      run: black --check dashboard/ tests/
      
    - name: Run Flake8 (Syntax & Style Linting)
      run: flake8 dashboard/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
      
    - name: Run MyPy (Static Type Checking)
      run: mypy dashboard/ tests/ --ignore-missing-imports